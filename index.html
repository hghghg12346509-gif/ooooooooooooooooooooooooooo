<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тропинка Знаний</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0f8ff;
            --pink: #ffb6c1;
            --blue: #87ceeb;
            --green: #98fb98;
            --yellow: #fffacd;
            --purple: #dda0dd;
            --text: #4a4a4a;
            --gold: #ffd700;
        }

        * { box-sizing: border-box; font-family: 'Nunito', sans-serif; user-select: none; }

        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #f0f8ff 0%, #e6e6fa 100%);
            color: var(--text); min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; position: relative;
        }

        /* --- ФОН --- */
        #bg-animations {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; pointer-events: none; overflow: hidden;
        }
        .bg-emoji {
            position: absolute; font-size: 100px; opacity: 0.15;
            animation: bgFloat infinite ease-in-out alternate;
            filter: blur(1px);
        }
        @keyframes bgFloat {
            0% { transform: translate(0, 0) rotate(-15deg) scale(1); }
            100% { transform: translate(30px, -40px) rotate(15deg) scale(1.1); }
        }

        /* --- ПАНЕЛИ --- */
        #top-bar {
            position: fixed; top: 15px; right: 20px;
            background: white; padding: 10px 20px; border-radius: 20px;
            font-size: 24px; font-weight: 900; color: #d4af37;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 3px solid var(--gold);
            display: flex; align-items: center; gap: 10px; z-index: 100;
        }
        #shop-btn {
            position: fixed; top: 15px; left: 20px;
            background: white; padding: 10px 20px; border-radius: 20px;
            font-size: 20px; font-weight: 900; color: var(--purple);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 3px solid var(--purple);
            cursor: pointer; z-index: 100; transition: transform 0.1s;
        }
        #shop-btn:active { transform: scale(0.95); }

        .screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 700px; padding: 20px; z-index: 10; animation: fadeIn 0.4s ease-out; margin-top: 60px; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- КАРТА --- */
        .map-container { display: flex; flex-direction: column; width: 100%; gap: 30px; padding-bottom: 50px; position: relative; }
        .map-node {
            width: 80px; height: 80px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 30px; font-weight: 900; color: white;
            box-shadow: 0 8px 0 rgba(0,0,0,0.2); cursor: pointer; transition: transform 0.2s;
            position: relative; z-index: 2; border: 4px solid white;
        }
        .map-node:hover { transform: scale(1.1); }
        .map-node:nth-child(1) { align-self: center; background: var(--green); }
        .map-node:nth-child(2) { align-self: flex-end; margin-right: 20%; background: var(--green); }
        .map-node:nth-child(3) { align-self: flex-start; margin-left: 20%; background: var(--green); }
        .map-node:nth-child(4) { align-self: center; background: var(--green); }
        .map-node:nth-child(5) { align-self: flex-end; margin-right: 10%; background: var(--green); }
        .map-node:nth-child(6) { align-self: flex-start; margin-left: 10%; background: var(--green); }
        .map-node:nth-child(7) { align-self: center; background: var(--green); }
        .map-node:nth-child(8) { align-self: flex-end; margin-right: 25%; background: var(--green); }
        .map-node:nth-child(9) { align-self: flex-start; margin-left: 25%; background: var(--green); }
        .map-node:nth-child(10) { align-self: center; background: var(--green); }
        .map-node.locked { background: #ccc; box-shadow: 0 8px 0 #999; color: #666; cursor: not-allowed; }
        .map-node.current { background: var(--yellow); color: #ff8c00; box-shadow: 0 8px 0 #d4af37; animation: bounceMap 1s infinite alternate; }
        @keyframes bounceMap { from { transform: translateY(0); } to { transform: translateY(-10px); } }

        /* --- ПЕРСОНАЖ --- */
        .character-container { position: relative; display: flex; flex-direction: column; align-items: center; z-index: 10; margin-bottom: 10px; }
        .character { font-size: 70px; animation: bounce 2s infinite ease-in-out; filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.1)); }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .speech-bubble {
            background: #fff; padding: 12px 20px; border-radius: 20px; font-size: 18px; font-weight: 900; color: #ff69b4;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-top: 10px; position: relative; text-align: center; border: 3px solid #ffb6c1;
            min-width: 250px; max-width: 90vw;
        }
        .speech-bubble::before {
            content: ''; position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            border-width: 0 15px 15px 15px; border-style: solid; border-color: transparent transparent #fff transparent;
        }

        /* --- ИГРА --- */
        .game-board {
            background: white; border-radius: 30px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%; display: flex; flex-direction: column; align-items: center; border: 4px solid var(--yellow);
        }
        .visual-aid { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; font-size: 35px; margin-bottom: 15px; gap: 5px; min-height: 50px; }
        .group { display: flex; flex-wrap: wrap; justify-content: center; max-width: 200px; }
        .group.crossed { opacity: 0.3; text-decoration: line-through; }
        .operator { font-size: 30px; font-weight: 900; color: var(--blue); margin: 0 10px; }

        .question-display { font-size: 50px; font-weight: 900; color: #ff69b4; margin-bottom: 20px; }
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; max-width: 400px; }
        .btn-option {
            background: var(--yellow); color: #ff8c00; border: 3px solid #ffd700; border-radius: 20px; padding: 15px;
            font-size: 32px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 0 #ffd700; transition: all 0.1s;
        }
        .btn-option:active { transform: translateY(6px); box-shadow: none; }

        .btn-help {
            margin-top: 15px; background: var(--purple); color: white; border: none; padding: 10px 20px;
            border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #9932cc;
        }
        .btn-help:active { transform: translateY(4px); box-shadow: none; }

        .btn-nav {
            margin-top: 15px; background: #ccc; color: #666; border: none; padding: 10px 20px; border-radius: 15px;
            font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #999;
        }
        .btn-nav:active { transform: translateY(4px); box-shadow: none; }

        /* --- РЕЗУЛЬТАТЫ --- */
        .result-board {
            background: white; border-radius: 30px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center; border: 4px solid var(--purple); width: 100%;
        }
        .reward-box { background: #fffacd; padding: 15px; border-radius: 15px; margin: 15px 0; border: 2px solid var(--gold); font-size: 22px; font-weight: 900; color: #d4af37; }
        
        .joke-box { background: #e0f7fa; padding: 20px; border-radius: 20px; margin-top: 15px; border-left: 6px solid var(--blue); text-align: left; }
        .joke-title { font-weight: 900; color: var(--blue); margin-bottom: 8px; font-size: 16px; text-transform: uppercase; }
        .joke-text { font-size: 20px; line-height: 1.5; font-weight: 700; color: #333; }

        /* --- МАГАЗИН --- */
        .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; margin-top: 20px; }
        .shop-item { background: white; padding: 15px; border-radius: 20px; text-align: center; border: 3px solid var(--purple); box-shadow: 0 6px 0 var(--purple); }
        .shop-item .emoji { font-size: 40px; margin-bottom: 10px; }
        .shop-item .name { font-weight: 900; font-size: 16px; color: #ff69b4; margin-bottom: 5px; }
        .shop-item .price { font-weight: 900; color: #d4af37; font-size: 18px; margin-bottom: 10px; }
        .shop-btn { background: var(--green); color: #006400; border: none; padding: 8px; border-radius: 10px; font-weight: 900; cursor: pointer; width: 100%; box-shadow: 0 4px 0 #32cd32; font-size: 14px; }
        .shop-btn:active { transform: translateY(4px); box-shadow: none; }
        .shop-btn.owned { background: #ddd; color: #888; box-shadow: none; cursor: default; }
        .shop-btn.equipped { background: var(--blue); color: white; box-shadow: 0 4px 0 #5f9ea0; }

        #particles-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; overflow: hidden; z-index: 100; }
        .particle { position: absolute; font-size: 30px; animation: explode 1s ease-out forwards; }
        @keyframes explode { 0% { transform: translate(0, 0) scale(0.5); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(180deg); opacity: 0; } }
    </style>
</head>
<body>

    <div id="bg-animations"></div>
    <div id="particles-container"></div>

    <div id="shop-btn" onclick="openShop()">🛍️ Магазин</div>
    <div id="top-bar">🪙 <span id="coin-display">0</span></div>

    <div id="map-screen" class="screen active">
        <div class="character-container">
            <div class="character" id="character-emoji">🐻</div>
            <div class="speech-bubble" id="speech-text">Привет! Выбирай урок на тропинке!</div>
        </div>
        <h1 style="color: var(--blue); text-align: center; margin-bottom: 30px;">Тропинка Знаний</h1>
        <div class="map-container" id="map-container"></div>
    </div>

    <div id="game-screen" class="screen">
        <div class="character-container">
            <div class="character" id="game-char">🐻</div>
            <div class="speech-bubble" id="game-speech">Давай посчитаем!</div>
        </div>
        
        <div class="game-board">
            <div class="visual-aid" id="visual-aid"></div>
            <div class="question-display" id="question-text">1 + 1 = ?</div>
            <div class="options-grid" id="options-container"></div>
            <button class="btn-help" onmouseenter="playSound('hover')" onclick="showHint()">💡 Помоги мне посчитать!</button>
        </div>
        
        <button class="btn-nav" onmouseenter="playSound('hover')" onclick="backToMap()">← Назад на тропинку</button>
    </div>

    <div id="result-screen" class="screen">
        <div class="character-container">
            <div class="character" id="result-char">🐻</div>
            <div class="speech-bubble" id="result-speech">Молодец!</div>
        </div>

        <div class="result-board">
            <h2 style="color: var(--green); font-size: 28px; margin-top: 0;">Урок пройден!</h2>
            <div style="font-size: 50px;" id="result-emoji">🏆</div>
            
            <div class="reward-box" id="reward-box">Награда: <span id="reward-coins">0</span> 🪙</div>

            <div class="joke-box" id="joke-box">
                <div class="joke-title" id="joke-title">Шутка от Мишутки:</div>
                <div class="joke-text" id="joke-text"></div>
            </div>

            <button class="btn-nav" style="margin-top: 20px; width: 100%; background: var(--green); color: white; box-shadow: 0 4px 0 #32cd32;" onmouseenter="playSound('hover')" onclick="backToMap()">На тропинку!</button>
        </div>
    </div>

    <div id="shop-screen" class="screen">
        <h1 style="color: var(--purple);">Магазин питомцев</h1>
        <p style="text-align: center;">Копи монетки и покупай новых друзей!</p>
        <div class="shop-grid" id="shop-grid"></div>
        <button class="btn-nav" style="margin-top: 30px;" onmouseenter="playSound('hover')" onclick="backToMap()">← Назад</button>
    </div>

    <script>
        // --- ГЕНЕРАЦИЯ ФОНА ---
        const bgEmojis = ['🔢', '➕', '➖', '✖️', '➗', '⭐', '🎈', '🌈', '☁️', '🍎', '🧸', '🐱', '🐶'];
        for (let i = 0; i < 15; i++) {
            const el = document.createElement('div');
            el.classList.add('bg-emoji');
            el.textContent = bgEmojis[Math.floor(Math.random() * bgEmojis.length)];
            el.style.left = Math.random() * 90 + 'vw';
            el.style.top = Math.random() * 90 + 'vh';
            el.style.animationDuration = (5 + Math.random() * 5) + 's';
            el.style.animationDelay = (Math.random() * 2) + 's';
            el.style.fontSize = (60 + Math.random() * 80) + 'px';
            document.getElementById('bg-animations').appendChild(el);
        }

        // --- ДЕТСКИЕ ШУТКИ (Простые и понятные) ---
        const jokes = [
            "— Почему у слона такие большие уши?\n— Чтобы лучше слышать, как растет трава!",
            "— Какая обувь никогда не промокает?\n— Резиновая!",
            "— Встречаются две коровы. Одна говорит:\n— Му!\nВторая:\n— Я тоже тебе му!",
            "— Что всегда стучит, а с места не сходит?\n— Сердце!",
            "— Почему грибы похожи на зонтики?\n— Потому что они прячутся от дождя!",
            "— Кто быстрее всех бегает?\n— Страус! Потому что он не летает, а бегает.",
            "— Почему у зайца длинные уши?\n— Чтобы слышать, как шепчутся морковки!",
            "— Что говорит чайник, когда закипает?\n— Пых-пых!",
            "— Почему рыбы молчат?\n— Потому что у них полный рот воды!",
            "— Кто всегда говорит правду, но его никто не слышит?\n— Зеркало!"
        ];

        const pets = [
            { id: 'bear', name: 'Мишутка', emoji: '🐻', price: 0 },
            { id: 'cat', name: 'Котик', emoji: '🐱', price: 50 },
            { id: 'dog', name: 'Собачка', emoji: '🐶', price: 50 },
            { id: 'bunny', name: 'Зайка', emoji: '🐰', price: 80 },
            { id: 'fox', name: 'Лисичка', emoji: '🦊', price: 80 },
            { id: 'panda', name: 'Панда', emoji: '🐼', price: 120 },
            { id: 'dragon', name: 'Дракончик', emoji: '🐲', price: 200 }
        ];

        const lessons = [
            { id: 1, title: "1", max: 5, type: 'add' },
            { id: 2, title: "2", max: 10, type: 'add' },
            { id: 3, title: "3", max: 5, type: 'sub' },
            { id: 4, title: "4", max: 10, type: 'sub' },
            { id: 5, title: "5", max: 15, type: 'add' },
            { id: 6, title: "6", max: 15, type: 'sub' },
            { id: 7, title: "7", max: 20, type: 'add' },
            { id: 8, title: "8", max: 20, type: 'sub' },
            { id: 9, title: "9", max: 20, type: 'mix' },
            { id: 10, title: "🏆", max: 20, type: 'mix' }
        ];

        // --- СОСТОЯНИЕ ---
        let coins = parseInt(localStorage.getItem('mathCoins')) || 0;
        let currentPetId = localStorage.getItem('mathPet') || 'bear';
        let ownedPets = JSON.parse(localStorage.getItem('mathOwnedPets')) || ['bear'];
        let unlockedLevel = parseInt(localStorage.getItem('mathUnlockedLevel')) || 1;
        let currentPetName = "Мишутка"; 

        // --- ЭЛЕМЕНТЫ ---
        const coinDisplay = document.getElementById('coin-display');
        const charEmoji = document.getElementById('character-emoji');
        const gameChar = document.getElementById('game-char');
        const speechText = document.getElementById('speech-text');

        function updateUI() {
            coinDisplay.textContent = coins;
            const pet = pets.find(p => p.id === currentPetId) || pets[0];
            currentPetName = pet.name;
            charEmoji.textContent = pet.emoji;
            gameChar.textContent = pet.emoji;
            document.getElementById('result-char').textContent = pet.emoji;
            
            // Меняем заголовок шутки
            document.getElementById('joke-title').textContent = `Шутка от ${currentPetName}:`;
        }

        // --- ЗВУКИ ---
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        document.body.addEventListener('click', initAudio, { once: true });

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;

            if (type === 'hover') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.setValueAtTime(600, now + 0.1); osc.frequency.setValueAtTime(800, now + 0.2); osc.frequency.setValueAtTime(1000, now + 0.3);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4); osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(80, now + 0.3);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'coin') {
                osc.type = 'square'; osc.frequency.setValueAtTime(988, now); osc.frequency.setValueAtTime(1319, now + 0.1);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4); osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'win') {
                osc.type = 'square'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.15); osc.frequency.setValueAtTime(783.99, now + 0.3); osc.frequency.setValueAtTime(1046.50, now + 0.45);
                gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.7); osc.start(now); osc.stop(now + 0.7);
            } else if (type === 'click') {
                osc.type = 'square'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05); osc.start(now); osc.stop(now + 0.05);
            }
        }

        function say(text) { 
            speechText.textContent = text; 
            document.getElementById('game-speech').textContent = text; 
        }

        // --- НАВИГАЦИЯ ---
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function backToMap() {
            playSound('click'); switchScreen('map-screen'); say("Выбирай следующий урок!"); renderMap(); updateUI();
        }

        // --- ОТРИСОВКА КАРТЫ ---
        function renderMap() {
            const container = document.getElementById('map-container');
            container.innerHTML = '';
            
            lessons.forEach((lesson, index) => {
                const node = document.createElement('div');
                node.classList.add('map-node');
                node.textContent = lesson.title;
                
                if (index + 1 < unlockedLevel) {
                    node.classList.add('completed');
                    node.onclick = () => startLesson(lesson, index + 1);
                } else if (index + 1 === unlockedLevel) {
                    node.classList.add('current');
                    node.onclick = () => startLesson(lesson, index + 1);
                } else {
                    node.classList.add('locked');
                    node.textContent = "🔒";
                }
                container.appendChild(node);
            });
        }

        // --- МАГАЗИН ---
        function openShop() {
            playSound('click'); switchScreen('shop-screen'); renderShop();
        }

        function renderShop() {
            const grid = document.getElementById('shop-grid'); grid.innerHTML = '';
            pets.forEach(pet => {
                const isOwned = ownedPets.includes(pet.id);
                const isEquipped = currentPetId === pet.id;
                const card = document.createElement('div'); card.classList.add('shop-item');
                
                let btnHtml = '';
                if (isEquipped) btnHtml = `<button class="shop-btn equipped">Надето</button>`;
                else if (isOwned) btnHtml = `<button class="shop-btn" onclick="equipPet('${pet.id}')">Надеть</button>`;
                else btnHtml = `<button class="shop-btn" onclick="buyPet('${pet.id}', ${pet.price})">Купить за ${pet.price} 🪙</button>`;

                card.innerHTML = `<div class="emoji">${pet.emoji}</div><div class="name">${pet.name}</div>${btnHtml}`;
                grid.appendChild(card);
            });
        }

        function buyPet(petId, price) {
            if (coins >= price) {
                coins -= price; ownedPets.push(petId); currentPetId = petId;
                localStorage.setItem('mathCoins', coins); localStorage.setItem('mathPet', currentPetId); localStorage.setItem('mathOwnedPets', JSON.stringify(ownedPets));
                playSound('coin'); say("Ура! Новый друг!"); updateUI(); renderShop();
            } else { playSound('wrong'); say("Не хватает монеток! Играй еще!"); }
        }

        function equipPet(petId) {
            playSound('click'); currentPetId = petId; localStorage.setItem('mathPet', currentPetId);
            updateUI(); renderShop(); say("Классный выбор!");
        }

        // --- ИГРОВАЯ ЛОГИКА ---
        let currentLessonObj = null;
        let correctAnswer = 0;
        let questionCount = 0;
        const QUESTIONS_PER_LESSON = 5;
        let lessonCorrectCount = 0;
        
        let num1 = 0, num2 = 0, op = '+';

        function startLesson(lesson, levelIndex) {
            playSound('click');
            currentLessonObj = lesson;
            questionCount = 0;
            lessonCorrectCount = 0;
            
            switchScreen('game-screen');
            say(`Урок ${levelIndex}. Давай учиться!`);
            generateQuestion();
        }

        function renderVisuals(a, b, operation) {
            const container = document.getElementById('visual-aid');
            container.innerHTML = '';
            
            const group1 = document.createElement('div'); group1.classList.add('group');
            for(let i=0; i<a; i++) group1.innerHTML += '🍎';
            
            const opEl = document.createElement('div'); opEl.classList.add('operator'); opEl.textContent = operation;
            
            const group2 = document.createElement('div'); group2.classList.add('group');
            for(let i=0; i<b; i++) group2.innerHTML += '🍎';

            container.appendChild(group1); container.appendChild(opEl); container.appendChild(group2);

            if (operation === '-') group2.classList.add('crossed');
        }

        function showHint() {
            playSound('click');
            const container = document.getElementById('visual-aid');
            container.innerHTML = '';
            
            say(`Считай пальчиком!`);
            
            const group1 = document.createElement('div'); group1.classList.add('group');
            for(let i=1; i<=num1; i++) group1.innerHTML += `<div style="display:flex; flex-direction:column; align-items:center; font-size:20px; margin: 2px;">${i}🍎</div>`;
            
            const opEl = document.createElement('div'); opEl.classList.add('operator'); opEl.textContent = op;
            
            const group2 = document.createElement('div'); group2.classList.add('group');
            for(let i=1; i<=num2; i++) group2.innerHTML += `<div style="display:flex; flex-direction:column; align-items:center; font-size:20px; margin: 2px;">${i}🍎</div>`;
            
            if(op === '-') group2.style.opacity = '0.3';

            container.appendChild(group1); container.appendChild(opEl); container.appendChild(group2);
        }

        function generateQuestion() {
            if (questionCount >= QUESTIONS_PER_LESSON) { finishLesson(); return; }

            let max = currentLessonObj.max;
            let type = currentLessonObj.type;

            if (type === 'add') {
                op = '+';
                num1 = Math.floor(Math.random() * (max - 2)) + 1;
                num2 = Math.floor(Math.random() * (max - num1)) + 1;
            } else if (type === 'sub') {
                op = '-';
                num1 = Math.floor(Math.random() * (max - 2)) + 2;
                num2 = Math.floor(Math.random() * (num1 - 1)) + 1;
            } else {
                if (Math.random() > 0.5) {
                    op = '+'; num1 = Math.floor(Math.random() * (max - 2)) + 1; num2 = Math.floor(Math.random() * (max - num1)) + 1;
                } else {
                    op = '-'; num1 = Math.floor(Math.random() * (max - 2)) + 2; num2 = Math.floor(Math.random() * (num1 - 1)) + 1;
                }
            }

            correctAnswer = op === '+' ? num1 + num2 : num1 - num2;
            renderVisuals(num1, num2, op);

            document.getElementById('question-text').textContent = `${num1} ${op} ${num2} = ?`;
            const optContainer = document.getElementById('options-container'); optContainer.innerHTML = '';
            
            let options = [correctAnswer];
            while (options.length < 4) {
                let wrong = correctAnswer + (Math.floor(Math.random() * 7) - 3);
                if (wrong !== correctAnswer && wrong >= 0 && !options.includes(wrong)) options.push(wrong);
            }
            options.sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button'); btn.classList.add('btn-option'); btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                optContainer.appendChild(btn);
            });

            document.getElementById('game-speech').textContent = `${currentPetName} просит: посчитай яблочки!`;
        }

        function checkAnswer(selected, btnElement) {
            const allButtons = document.querySelectorAll('.btn-option');
            allButtons.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correctAnswer) {
                playSound('correct'); 
                lessonCorrectCount++;
                questionCount++;
                
                btnElement.style.background = '#98fb98'; btnElement.style.borderColor = '#32cd32'; btnElement.style.color = '#006400';
                say("Правильно! 🎉"); 
                createFireworks(btnElement);

                setTimeout(() => { 
                    allButtons.forEach(b => b.style.pointerEvents = 'auto'); 
                    generateQuestion(); 
                }, 1200);
            } else {
                playSound('wrong');
                btnElement.style.background = '#ffb6c1'; btnElement.style.borderColor = '#ff69b4'; btnElement.style.color = '#8b0000'; btnElement.style.opacity = '0.5'; btnElement.style.pointerEvents = 'none';
                say("Ой, не так. Нажми на лампочку, я помогу!");
                
                setTimeout(() => { 
                    allButtons.forEach(b => { if (b !== btnElement) b.style.pointerEvents = 'auto'; }); 
                }, 500);
            }
        }

        function finishLesson() {
            switchScreen('result-screen');
            playSound('win');
            
            const earnedCoins = lessonCorrectCount * 10; 
            coins += earnedCoins;
            localStorage.setItem('mathCoins', coins);
            
            if (unlockedLevel === currentLessonObj.id && unlockedLevel < 10) {
                unlockedLevel++;
                localStorage.setItem('mathUnlockedLevel', unlockedLevel);
            }

            document.getElementById('reward-coins').textContent = earnedCoins;
            const randomJoke = jokes[Math.floor(Math.random() * jokes.length)];
            
            // Заменяем перенос строки \n на <br> для красивого отображения
            document.getElementById('joke-text').innerHTML = randomJoke.replace(/\n/g, '<br>');
            
            document.getElementById('result-emoji').textContent = "🏆🌟"; 
            document.getElementById('result-speech').textContent = "Ты справился! Урок пройден!";
            
            createFireworks(document.body, 30);
            updateUI();
        }

        function createFireworks(sourceElement, count = 15) {
            const container = document.getElementById('particles-container');
            const rect = sourceElement.getBoundingClientRect();
            const startX = rect.left + rect.width / 2; const startY = rect.top + rect.height / 2;
            const emojis = ['⭐', '🌟', '✨', '🎈', '🎉', '💖', '🍬', '🪙'];
            for(let i = 0; i < count; i++) {
                const particle = document.createElement('div'); particle.classList.add('particle');
                particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                particle.style.left = startX + 'px'; particle.style.top = startY + 'px';
                particle.style.setProperty('--tx', (Math.random() - 0.5) * 600 + 'px');
                particle.style.setProperty('--ty', (Math.random() - 0.5) * 600 + 'px');
                particle.style.animationDelay = Math.random() * 0.2 + 's';
                container.appendChild(particle); setTimeout(() => particle.remove(), 1500);
            }
        }

        // Инициализация
        updateUI();
        renderMap();
    </script>
</body>
</html>
